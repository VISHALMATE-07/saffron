<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart | SAFFRON Restaurant</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cart">
<nav class="navbar"><a class="brand" href="index.html">SAFFRON<small>RESTAURANT</small></a>
<button class="burger" onclick="document.querySelector('.links').classList.toggle('open')">☰</button>
<ul class="links"><li><a href="index.html">Home</a></li><li><a href="menu.html">Menu</a></li><li><a href="index.html#about">About</a></li><li><a href="index.html#contact">Contact</a></li><li><a href="login.html" id="authLink">Login</a></li><li><a href="cart.html">🛒 Cart (<span id="cartCount">0</span>)</a></li></ul></nav>
<section class="section narrowbox" id="cartBox"><h2 class="title">Your Cart</h2><div id="cartItems"></div>
<div id="checkout" class="card" hidden><h3>Customer Details</h3>
<label>Customer Name<input id="custName" placeholder="Your name"></label>
<label>Phone Number<input id="custPhone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"></label>
<label>Special Instructions (optional)<textarea id="notes" rows="2"></textarea></label>
<button class="btn full" id="placeOrder">PLACE ORDER</button></div></section>
<section class="section narrowbox"><h2 class="title">My Orders</h2><div id="myOrders"></div></section>
<footer><b>SAFFRON Restaurant</b><br>© 2026 SAFFRON Restaurant. All Rights Reserved.</footer>
<script type="module" src="js/script.js"></script>
</body>
</html>
