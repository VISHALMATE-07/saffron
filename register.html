<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register - SAFFRON</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="navbar">
  <a class="logo" href="index.html"><span class="logo-main">SAFFRON</span><span class="logo-sub">RESTAURANT</span></a>
  <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">&#9776;</button>
  <nav class="nav-links" id="navLinks">
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="index.html#about">About</a>
    <a href="index.html#contact">Contact</a>
    <a href="admin.html" id="adminLink" class="hidden">Admin</a>
    <a href="login.html" id="authLink" class="active">Login</a>
    <a href="cart.html">Cart <span class="badge" id="cartCount">0</span></a>
  </nav>
</header>

<main class="auth-wrap">
  <div class="card form-card">
    <h2>Create Account</h2>
    <form id="registerForm" novalidate>
      <label for="name">Full Name</label>
      <input type="text" id="name" maxlength="50" autocomplete="name">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email">
      <label for="phone">Phone</label>
      <input type="tel" id="phone" maxlength="10" placeholder="10-digit mobile number" autocomplete="tel">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="new-password" placeholder="At least 6 characters">
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" autocomplete="new-password">
      <p class="error-text" id="formMessage"></p>
      <button type="submit" class="btn btn-full" id="registerBtn">Register</button>
    </form>
    <p class="center">Already have an account? <a href="login.html"><u>Login</u></a></p>
  </div>
</main>
<footer class="footer">
  <strong>SAFFRON</strong> Restaurant<br>
  <small>&copy; 2026 SAFFRON Restaurant. All rights reserved.</small>
</footer>
<script type="module" src="js/auth.js"></script>
</body>
</html>
